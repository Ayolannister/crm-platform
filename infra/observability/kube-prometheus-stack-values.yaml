# Installed from chart prometheus-community/kube-prometheus-stack version 92.21.2
# Installed from chart prometheus-community/kube-prometheus-stack version 92.21.2
# Lean monitoring for a single-node kind cluster.
fullnameOverride: kps
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors and rules from every namespace and release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
grafana:
  # No adminPassword here: the chart generates one into a Secret.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  grafana.ini:
    plugins:
      preinstall_disabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc:3100
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      jsonData:
        serviceMap:
          datasourceUid: prometheus
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
# kind does not expose these control-plane metrics; scraping them only creates false alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
