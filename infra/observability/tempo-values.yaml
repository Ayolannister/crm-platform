# Installed from chart grafana/tempo version 1.24.4
# Single-binary Tempo, traces kept for a day.
tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  enabled: false
