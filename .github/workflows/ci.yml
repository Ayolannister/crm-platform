name: CI

on:
  push:
    branches: [main]
    # Release PRs and infra changes only touch these paths. Skipping them on
    # main prevents a merged release PR from triggering yet another release.
    paths-ignore:
      - "deploy/**"
      - "infra/**"
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.76.1"
  GITLEAKS_VERSION: "v8.30.1"
  KUBECONFORM_VERSION: "v0.7.0"
  HELM_VERSION: "v3.20.2"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform validate

      - name: Validate dev environment
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false && terraform validate

      - name: Scan for misconfigurations
        run: >
          docker run --rm -v "$PWD:/work"
          aquasec/trivy:${{ env.TRIVY_VERSION }} config
          --exit-code 1 --severity HIGH,CRITICAL /work/infra/terraform

  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:${{ env.GITLEAKS_VERSION }}
          detect --source /repo --redact -v

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint deploy/helm/crm-api -f deploy/helm/crm-api/values-local.yaml

      - name: Validate rendered chart
        run: >
          helm template crm-api deploy/helm/crm-api -n crm -f deploy/helm/crm-api/values-local.yaml
          | docker run --rm -i ghcr.io/yannh/kubeconform:${{ env.KUBECONFORM_VERSION }} -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Validate rendered chart (aws-dev)
        run: >
          helm template crm-api deploy/helm/crm-api -n crm -f deploy/helm/crm-api/values-aws-dev.yaml
          | docker run --rm -i ghcr.io/yannh/kubeconform:${{ env.KUBECONFORM_VERSION }} -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Validate local dependency manifests
        run: >
          docker run --rm -v "$PWD:/work"
          ghcr.io/yannh/kubeconform:${{ env.KUBECONFORM_VERSION }} -strict -summary /work/deploy/k8s

  image:
    name: Build, scan and publish image
    needs: [changes, test, secrets]
    # Keep image validation on PRs; on main, build/publish only for API changes.
    if: github.event_name == 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true' }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ steps.push.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          load: true
          tags: crm-api:local
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:${{ env.TRIVY_VERSION }} image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          crm-api:local

      - name: Create CI environment file
        run: printf 'JWT_SECRET=%s\n' "$(openssl rand -base64 48)" > apps/api/.env

      - name: Start the stack with the built image
        run: docker compose up -d --no-build

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        id: push
        if: env.PUBLISH == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crm-api"
          TAG="sha-${GITHUB_SHA::7}"
          docker tag crm-api:local "$IMAGE:$TAG"
          docker tag crm-api:local "$IMAGE:main"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:main"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$TAG\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

  release-local:
    name: Open local release PR
    needs: image
    # Avoid opening an empty release PR if image publishing was skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.result == 'success' && needs.image.outputs.digest != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get a short-lived bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CRM_BOT_APP_ID }}
          private-key: ${{ secrets.CRM_BOT_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Point local values at the new image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: yq -i '.image.digest = strenv(DIGEST)' deploy/helm/crm-api/values-local.yaml

      - name: Open or update the release PR
        uses: peter-evans/create-pull-request@v7.0.0
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: release/local
          delete-branch: true
          commit-message: "release(local): deploy crm-api ${{ needs.image.outputs.tag }}"
          title: "Release crm-api ${{ needs.image.outputs.tag }} to local"
          body: |
            Automated release PR, opened after a successful build on `main`.

            - Image: `${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}`
            - Digest: `${{ needs.image.outputs.digest }}`
            - Built from: ${{ github.sha }}

            Merging this PR deploys the image to the local cluster through Argo CD.
