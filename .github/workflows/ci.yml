    name: CI

    on:
      push:
        branches: [main]
      pull_request:
        branches: [main]

    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    env:
       TRIVY_VERSION: "0.76.1"
       GITLEAKS_VERSION: "v8.30.1"

    jobs:
      test:
        name: Lint, test, build
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: apps/api
        steps:
          - name: Check out code
            uses: actions/checkout@v5

          - name: Set up Node
            uses: actions/setup-node@v5
            with:
              node-version-file: .nvmrc
              cache: npm
              cache-dependency-path: apps/api/package-lock.json

          - name: Install dependencies
            run: npm ci

          - name: Lint
            run: npm run lint --if-present

          - name: Unit tests
            run: npm test

          - name: Build
            run: npm run build

      secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
          - name: Check out full history
            uses: actions/checkout@v5
            with:
              fetch-depth: 0

          - name: Run Gitleaks
            run: >
              docker run --rm -v "$PWD:/repo"
              zricethezav/gitleaks:${{ env.GITLEAKS_VERSION }}
              detect --source /repo --redact -v

      image:
        name: Build, scan and publish image
        needs: [test, secrets]
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        env:
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        steps:
          - name: Check out code
            uses: actions/checkout@v5

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build image
            uses: docker/build-push-action@v6
            with:
              context: apps/api
              load: true
              tags: crm-api:local
              cache-from: type=gha
              cache-to: type=gha,mode=max

          - name: Scan image for vulnerabilities
            run: >
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
              aquasec/trivy:${{ env.TRIVY_VERSION }} image
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
              crm-api:local

          - name: Create CI environment file
            run: printf 'JWT_SECRET=%s\n' "$(openssl rand -base64 48)" > apps/api/.env

          - name: Start the stack with the built image
            run: docker compose up -d --no-build

          - name: Run smoke tests
            run: ./scripts/smoke-test.sh

          - name: Show logs on failure
            if: failure()
            run: docker compose logs

          - name: Tear down
            if: always()
            run: docker compose down -v

          - name: Log in to GitHub Container Registry
            if: env.PUBLISH == 'true'
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Push the tested image
            if: env.PUBLISH == 'true'
            run: |
              IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crm-api"
              SHORT_SHA="${GITHUB_SHA::7}"
              docker tag crm-api:local "$IMAGE:sha-$SHORT_SHA"
              docker tag crm-api:local "$IMAGE:main"
              docker push "$IMAGE:sha-$SHORT_SHA"
              docker push "$IMAGE:main"
              echo "Published \`$IMAGE:sha-$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"