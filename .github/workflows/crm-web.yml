name: CRM Web CI and Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/crm-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/crm-web.yml'

permissions:
  contents: read

jobs:
  web:
    name: Build, scan, and release frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          load: true
          tags: crm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress crm-web:ci
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and record immutable digest
        id: publish
        if: github.event_name == 'push'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${REPO_OWNER,,}/crm-web"
          TAG="sha-${GITHUB_SHA::7}"
          docker tag crm-web:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)"
          test -n "$DIGEST"
          echo "image_ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

  release-local:
    name: Open local frontend release PR
    needs: web
    if: github.event_name == 'push' && needs.web.result == 'success' && needs.web.outputs.image_ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get short-lived bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CRM_BOT_APP_ID }}
          private-key: ${{ secrets.CRM_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
      - name: Pin new image in local deployment
        env:
          IMAGE_REF: ${{ needs.web.outputs.image_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('deploy/k8s/crm-web/web.yaml')
          src = p.read_text()
          src, count = re.subn(r'(?m)^([ \t]*image:[ \t]*)(?:crm-web:[^ \t\r\n]+|ghcr\.io/[^ \t\r\n]+/crm-web@sha256:[0-9a-f]+)[ \t]*$', lambda m: m.group(1) + os.environ['IMAGE_REF'], src)
          if count != 1:
              raise SystemExit(f'Expected exactly one web image entry, found {count}')
          src = src.replace('imagePullPolicy: Never', 'imagePullPolicy: IfNotPresent')
          p.write_text(src)
          PY
      - name: Open frontend release PR
        uses: peter-evans/create-pull-request@v7.0.0
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: release/web-local
          delete-branch: true
          commit-message: 'release(web): pin CRM frontend image'
          title: 'Release CRM frontend to local Kind'
          body: 'Pins the tested GHCR frontend image by immutable digest. Merge to let Argo CD synchronize.'
