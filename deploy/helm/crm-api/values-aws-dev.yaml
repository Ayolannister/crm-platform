# Floci EKS dev environment.
replicaCount: 1   # one small node; a PDB of minAvailable 1 would block node maintenance

image:
  repository: ghcr.io/ayolannister/crm-api
  digest: sha256:205e9bdb3be4657d0af4f3feacb27d2310307efe7f44331b6c407c1ca53600f8

config:
  NODE_ENV: production
  REDIS_URL: ""   # ElastiCache not provisioned until the app uses Redis

podDisruptionBudget:
  enabled: false

dbBootstrap:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
