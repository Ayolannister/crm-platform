# Floci EKS dev environment.
replicaCount: 1   # one small node; a PDB of minAvailable 1 would block node maintenance

image:
  repository: localhost:5100/000000000000/us-east-1/crm-api   # ECR, path style (Floci)
  digest: sha256:a7fc6d0e4799b331c21ff66ea0519838de08340ca1b3f8bbbf8682304463a727

config:
  NODE_ENV: production
  REDIS_URL: ""   # ElastiCache not provisioned until the app uses Redis

podDisruptionBudget:
  enabled: false

dbBootstrap:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi