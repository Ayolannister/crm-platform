{{- if .Values.dbBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crm-api.fullname" . }}-db-bootstrap
  labels:
    {{- include "crm-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "crm-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # the postgres user in the official Alpine image
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-bootstrap
          image: {{ .Values.dbBootstrap.image }}
          envFrom:
            - secretRef:
                name: {{ .Values.dbBootstrap.secret }}
          command: ["sh", "-c"]
          args:
            - |
              psql "$MASTER_URL" -v ON_ERROR_STOP=1 \
                -v owner_pw="$OWNER_PASSWORD" -v app_pw="$APP_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE crm_owner LOGIN PASSWORD %L', :'owner_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_owner') \gexec
              SELECT format('CREATE ROLE crm_app LOGIN PASSWORD %L', :'app_pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_app') \gexec
              ALTER ROLE crm_owner WITH LOGIN PASSWORD :'owner_pw';
              ALTER ROLE crm_app WITH LOGIN PASSWORD :'app_pw';
              GRANT crm_owner TO CURRENT_USER;
              GRANT CONNECT, CREATE ON DATABASE crm TO crm_owner;
              GRANT CONNECT ON DATABASE crm TO crm_app;
              GRANT USAGE, CREATE ON SCHEMA public TO crm_owner;
              GRANT USAGE ON SCHEMA public TO crm_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE crm_owner IN SCHEMA public
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO crm_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE crm_owner IN SCHEMA public
                GRANT USAGE, SELECT ON SEQUENCES TO crm_app;
              SQL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            {{- include "crm-api.containerSecurityContext" . | nindent 12 }}
{{- end }}