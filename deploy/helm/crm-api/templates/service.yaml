apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm-api.fullname" . }}
  labels:
    {{- include "crm-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "crm-api.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http