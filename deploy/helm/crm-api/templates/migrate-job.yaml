{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crm-api.fullname" . }}-migrate
  labels:
    {{- include "crm-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "crm-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "crm-api.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "crm-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.migrate }}
          resources:
            {{- toYaml .Values.migrateResources | nindent 12 }}
          securityContext:
            {{- include "crm-api.containerSecurityContext" . | nindent 12 }}
{{- end }}