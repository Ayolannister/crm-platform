{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "crm-api.fullname" . }}
  labels:
    {{- include "crm-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "crm-api.apiSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
