apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crm-api
  namespace: crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: crm-api
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: crm/dev/api
---
