apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-web
  namespace: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-web
  template:
    metadata:
      labels:
        app: crm-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ayolannister/crm-web@sha256:63ac0da0ff68d69fe069e4cf87c23f73b46f6fd038f80587e2d70f9632cd1aaf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: CRM_API_URL
              value: http://crm-api.crm.svc.cluster.local
            - name: CRM_WEB_ORIGIN
              value: http://localhost:3001
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crm-web
  namespace: crm
spec:
  selector:
    app: crm-web
  ports:
    - port: 80
      targetPort: 3000
