apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-secrets-aws-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ayolannister/crm-platform.git
    targetRevision: main
    path: deploy/aws-dev/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: crm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m