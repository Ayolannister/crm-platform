apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-grafana-dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ayolannister/crm-platform.git
    targetRevision: main
    path: deploy/observability/grafana

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
