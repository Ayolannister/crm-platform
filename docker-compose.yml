    services:
      migrate:
        build:
          context: ./apps/api
        image: crm-api:local
        command: ["node", "dist/db/migrate.js"]
        environment:
          DATABASE_URL: postgres://crm:crm@postgres:5432/crm
        depends_on:
          postgres:
            condition: service_healthy

      api:
        build:
          context: ./apps/api
        image: crm-api:local
        ports:
          - "3000:3000"
        init: true
        env_file:
          - path: ./apps/api/.env
            required: false
        environment:
          PORT: 3000
          DATABASE_URL: postgres://crm:crm@postgres:5432/crm
          REDIS_URL: redis://redis:6379
        healthcheck:
          test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
          interval: 10s
          timeout: 3s
          retries: 5
        depends_on:
          migrate:
            condition: service_completed_successfully
          redis:
            condition: service_healthy

      postgres:
        image: postgres:17-alpine
        environment:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - "127.0.0.1:5434:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
          interval: 5s
          timeout: 3s
          retries: 10

      redis:
        image: redis:8-alpine
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 10

    volumes:
      pgdata: